<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battleground Early Vote</title>
<meta name="description" content="How the 2026 early vote's party margin compares with 2024 in 13 battleground states.">
<meta property="og:title" content="How the 2026 early vote has shifted since 2024">
<meta property="og:description" content="Early-vote party margin vs 2024 in 13 battleground states, updated twice a day.">
<meta property="og:image" content="https://homedoctorpro.github.io/election-tracker/share.png">
<meta property="og:image:width" content="1080"><meta property="og:image:height" content="1350">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* A fixed 1080x1350 card (4:5), scaled down to fit narrower screens. share.png is a screenshot of it. */
:root{--bg:#f6f4ef;--card:#fff;--ink:#16181d;--muted:#6b6f78;--line:#e6e2d9;--dem:#2459d8;--rep:#d6312b;--dem-t:#e6edfc;--rep-t:#fbe8e7}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);overflow-x:hidden}
#wrap{position:relative;width:100%;overflow:hidden}
#stage{position:absolute;left:0;top:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{width:1080px;height:1350px;transform-origin:0 0;padding:58px 60px 44px;display:flex;flex-direction:column}
.kicker{font-size:22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dem)}
h1{font-size:54px;line-height:1.04;font-weight:800;letter-spacing:-.02em;margin-top:10px}
.sub{font-size:24px;color:var(--muted);margin-top:12px}
.key{display:flex;align-items:center;gap:26px;font-size:21px;color:var(--muted);margin:26px 0 8px}
.key i{display:inline-block;width:20px;height:20px;border-radius:50%;vertical-align:-3px;margin-right:8px}
.key .ax{margin-left:auto;font-weight:600}
.key .ax b{color:var(--rep)}.key .ax em{font-style:normal;color:var(--dem)}
.grp{display:flex;align-items:baseline;gap:12px;margin:16px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.grp b{font-size:20px;letter-spacing:.1em;text-transform:uppercase}
.grp span{font-size:19px;color:var(--muted)}
.row{display:grid;grid-template-columns:318px 1fr 140px;align-items:center;gap:22px;height:49px;border-bottom:1px solid var(--line)}
.row.early{opacity:.4}
.st{line-height:1.1}.st b{font-size:25px;font-weight:700}.st b .part{font-size:17px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.st small{display:block;font-size:16px;color:var(--muted);margin-top:3px;white-space:nowrap}
.tr{position:relative;height:30px}
.tr .bg{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--rep-t),#efede8 50%,var(--dem-t))}
.tr .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#b9b5ac}
.tr .ln{position:absolute;top:13px;height:4px;border-radius:2px}
.tr .ln.dash{background-image:repeating-linear-gradient(90deg,currentColor 0 8px,transparent 8px 13px)!important;background-color:transparent!important}
.tr .o,.tr .s{position:absolute;top:5px;width:20px;height:20px;margin-left:-10px;border-radius:50%}
.tr .o{border:4px solid #8a8e96;background:var(--card)}
.sh{text-align:right;font-size:34px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.foot{margin-top:auto;padding-top:18px;font-size:17.5px;line-height:1.4;color:var(--muted)}
.foot b{color:var(--ink);font-weight:600}
.url{margin-top:10px;font-size:20px;font-weight:600;color:var(--ink)}
/* both: two shift columns */
.row.b3{grid-template-columns:300px 1fr 104px 104px;gap:14px;height:46px}
.row.b3.hd{height:auto;border:0;font-size:16px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:8px}
.sh2{text-align:right;font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.sh2 sup{font-size:16px}
.row.b3.hd .sh2{font-size:15px;font-weight:600}
/* trend: small multiples */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 20px;margin-top:4px}
.pn{border-top:2px solid var(--ink);padding-top:5px}
.pn h3{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:700;white-space:nowrap}
.pn h3 span{font-size:20px;font-weight:800}
.pn .m{font-size:14px;color:var(--muted);margin:0 0 2px;white-space:nowrap}
.pn svg{display:block}
.pn.sec{border-top-color:#b9b5ac}
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<script>
const DATA=/*DATA*/null;
const MODE=/*MODE*/'2024'; // '2024' or '2022': shift since that year; 'trend': margin by day
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sgn=v=>v==null?'':(v>=0?'D+':'R+')+Math.abs(v).toFixed(1);
const col=v=>v>=0?'var(--dem)':'var(--rep)';
const k=v=>v>=1e6?(v/1e6).toFixed(2).replace(/0$/,'')+'M':Math.round(v/1e3)+'K';
const Y=MODE==='2022'?'2022':'2024';
const head=b=>(b.headlines||{})[Y];
const kind=b=>head(b)?head(b).kind:'none';
const early=b=>kind(b)!=='same'&&head(b)&&((b.shifts['2024']?.n_2026??1e9)<5000||(b.pct_of_final_2024??100)<5);
function pace(b){if(b.pace[Y])return `${Math.round(b.pace[Y].pct)}% of ${Y} to date`;
  const f=b['pct_of_final_'+Y];return f!=null?`${Math.round(f)}% of ${Y} total`:''}
// vs-final states with in-person data get two rows: mail, then in person (headlines_ip)
function split(list){return list.flatMap(b=>{const ip=b.headlines_ip||{};if(!Object.keys(ip).length)return [b];
  return [{...b,_part:'mail'},{...b,_part:'ip',headlines:ip,headline:ip[Y]}]})}
const label=b=>esc(b.state_name)+(b._part==='mail'?' <span class="part">mail</span>':b._part==='ip'?' <span class="part">in person</span>':'');
function votes(b){if(b._part==='ip')return `${k(b.inperson.n)} in-person votes`;
  if(b._part==='mail')return `${k(b.ev.total-b.inperson.n)} mail ballots`;
  return `${(b.headline||{}).votes==='primary'?'by primary ballot · ':''}${k(b.ev.total)} votes${pace(b)?' · '+pace(b):''}`}
function render(){
  const B=DATA.battlegrounds.filter(head).map(b=>({...b,headline:head(b)}));
  const vals=B.flatMap(b=>[b.headline.from,b.headline.to]).map(Math.abs);
  const lim=Math.max(20,Math.ceil(Math.max(...vals)/10)*10),pos=v=>50+50*Math.max(-lim,Math.min(lim,v))/lim;
  const thru=DATA.battlegrounds.map(b=>b.data_through).sort().pop();
  const d=new Date(thru+'T12:00:00'),left=Math.round((new Date('2026-11-03T12:00:00')-d)/864e5);
  const date=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const row=b=>{const h=b.headline,a=pos(h.from),z=pos(h.to),c=col(h.value),kd=kind(b);
    return `<div class="row${early(b)?' early':''}">
      <div class="st"><b>${label(b)}</b><small>${votes(b)}${early(b)?' · too early':''}</small></div>
      <div class="tr"><div class="bg"></div><div class="mid"></div>
        <div class="ln${kd==='same'||h.same_day?'':' dash'}" style="left:${Math.min(a,z)}%;width:${Math.abs(z-a)}%;background:${c};color:${c}"></div>
        <div class="o" style="left:${a}%"></div><div class="s" style="left:${z}%;background:${col(h.to)}"></div></div>
      <div class="sh" style="color:${c}">${sgn(h.value)}</div></div>`};
  const by=(a,b)=>(early(a)-early(b))||b.headline.value-a.headline.value;
  const G=[['same','Same day',`all early votes vs this point in ${Y}`],
    ['final','Vs final','mail and in-person votes vs the final 2024 mix'],
    ['county','County lean',Y==='2022'?'no 2022 party data: where early votes come from vs 2022':`no party registration: where early votes come from vs ${Y}`]];
  const missing=DATA.battlegrounds.filter(b=>!head(b)).map(b=>b.state_name);
  document.getElementById('stage').innerHTML=`
    <div class="kicker">2026 early vote · battlegrounds</div>
    <h1>The early vote vs ${Y}</h1>
    <div class="sub">D&minus;R margin of early votes, ${Y}${Y==='2022'?' (last midterm)':''} to 2026. Through ${date}, ${left} days to Election Day.</div>
    <div class="key"><span><i style="border:4px solid #8a8e96;background:#fff"></i>${Y}</span><span><i style="background:var(--dem)"></i>2026</span>
      <span>Dashed = rougher comparison</span><span class="ax"><b>&larr; R</b> &nbsp;&nbsp; <em>D &rarr;</em></span></div>
    ${G.map(([g,t,s])=>{const L=split(B.filter(b=>kind(b)===g).sort(by)).filter(b=>b.headline);return L.length?`<div class="grp"><b>${t}</b><span>${s}</span></div>${L.map(row).join('')}`:''}).join('')}
    <div class="foot"><b>Same day</b> is the most reliable read.${Y==='2024'?' <b>Vs final</b> rows are rough: early mail leans more Democratic than the final count, and in-person voting started later and usually gets more Republican as it goes.':''}
      <b>County lean</b> is the 2024 presidential margin of the counties early votes come from, this year vs the ${Y} early vote by county.${missing.length?` ${esc(missing.join(', '))}: no ${Y} party or county data.`:''} Ohio: last primary ballot, not registration.
      Sources: UF Election Lab, state election offices, EAC.
      <div class="url">homedoctorpro.github.io/election-tracker</div></div>`;
}

// trend: the headline measure by days before Election Day, one small chart per state
const TC={2022:'#9aa0a8',2024:'#e08a1e',2026:'var(--dem)'};
function chart(t,dout){
  const W=240,H=138,P={l:40,r:6,t:6,b:22},X0=30;
  const S=Object.entries(t.series).map(([y,s])=>[y,s.filter(p=>p[0]<=X0)]).filter(([y,s])=>s.length);
  const vals=S.flatMap(([y,s])=>s.map(p=>p[1])).concat(Object.values(t.final));
  if(!vals.length)return '';
  let lo=Math.min(...vals),hi=Math.max(...vals);const pad=Math.max(3,(hi-lo)*.15);lo-=pad;hi+=pad;
  const x=d=>P.l+(X0-d)/X0*(W-P.l-P.r),y=v=>H-P.b-(v-lo)/(hi-lo)*(H-P.t-P.b);
  const step=(hi-lo)>40?20:(hi-lo)>16?10:5;
  let g='';
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#9a968d':'#e6e2d9'}" stroke-width="${v===0?1.5:1}"/><text x="${P.l-6}" y="${y(v)+5}" text-anchor="end" font-size="14" fill="#6b6f78">${v===0?'0':(v>0?'D':'R')+Math.abs(v)}</text>`;
  [30,20,10,0].forEach(d=>g+=`<text x="${x(d)}" y="${H-5}" text-anchor="middle" font-size="14" fill="#6b6f78">${d}</text>`);
  g+=`<line x1="${x(dout)}" x2="${x(dout)}" y1="${P.t}" y2="${H-P.b}" stroke="#b9b5ac" stroke-dasharray="3 4"/>`;
  // a year with only a final value: dashed reference line
  Object.entries(t.final).forEach(([yr,v])=>{if(!(t.series[yr]||[]).some(p=>p[0]<=X0)||t.measure==='mail')
    g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="${TC[yr]}" stroke-width="2" stroke-dasharray="6 5"/>`});
  // past-cycle mail figures are a few scattered days, so they're dots rather than a line
  S.sort((a,b)=>a[0]-b[0]).forEach(([yr,s])=>{const w=yr==='2026'?4:2.5;
    if(t.measure==='mail'&&yr!=='2026'){s.forEach(p=>g+=`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="4" fill="${TC[yr]}"/>`);return}
    g+=s.length>1?`<polyline fill="none" stroke="${TC[yr]}" stroke-width="${w}" stroke-linejoin="round" points="${s.map(p=>x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ')}"/>`:'';
    const e=s[s.length-1];g+=`<circle cx="${x(e[0])}" cy="${y(e[1])}" r="${yr==='2026'?5.5:3.5}" fill="${TC[yr]}"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}
// Nevada: Democratic minus Republican ballots (a count) after each day of early in-person voting
function nvTile(nv,span){
  const a=nv&&nv.days['2026'];if(!a||!a.length)return '';
  const b=nv.days['2024']||[],W=240*span+20*(span-1),H=150,P={l:52,r:56,t:8,b:22};
  const maxDay=Math.max(16,...a.map(p=>p[0]),...b.map(p=>p[0])),vals=[...a,...b].map(p=>p[1]);
  const lo=Math.min(0,...vals),hi=Math.max(0,...vals),step=[5e3,1e4,2e4,25e3,5e4].find(s=>(hi-lo)/s<=5)||1e5;
  const yl=Math.floor(lo/step)*step,yh=Math.ceil(hi/step)*step;
  const x=d=>P.l+(d-1)/(maxDay-1)*(W-P.l-P.r),y=v=>H-P.b-(v-yl)/(yh-yl)*(H-P.t-P.b);
  const kk=v=>v===0?'0':(v>0?'D':'R')+Math.round(Math.abs(v)/1e3)+'K',n=v=>(v>=0?'D+':'R+')+Math.abs(v).toLocaleString('en-US');
  let g='';
  for(let v=yl;v<=yh;v+=step)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#9a968d':'#e6e2d9'}" stroke-width="${v===0?1.5:1}"/><text x="${P.l-6}" y="${y(v)+5}" text-anchor="end" font-size="14" fill="#6b6f78">${kk(v)}</text>`;
  [1,4,8,12,16].forEach(d=>g+=`<text x="${x(d)}" y="${H-5}" text-anchor="middle" font-size="14" fill="#6b6f78">${d}</text>`);
  const now=a[a.length-1],then=b.find(p=>p[0]===now[0]);
  g+=`<line x1="${x(now[0])}" x2="${x(now[0])}" y1="${P.t}" y2="${H-P.b}" stroke="#b9b5ac" stroke-dasharray="3 4"/>`;
  [['2024',b],['2026',a]].forEach(([yr,s])=>{if(!s.length)return;const e=s[s.length-1];
    g+=`<polyline fill="none" stroke="${TC[yr]}" stroke-width="${yr==='2026'?4:2.5}" stroke-linejoin="round" points="${s.map(p=>x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ')}"/>`+
      `<circle cx="${x(e[0])}" cy="${y(e[1])}" r="${yr==='2026'?5.5:3.5}" fill="${TC[yr]}"/><text x="${x(e[0])+8}" y="${y(e[1])+5}" font-size="14" font-weight="700" fill="${TC[yr]}">${kk(e[1])}</text>`});
  const gap=then?now[1]-then[1]:null;
  return `<div class="pn" style="grid-column:span ${span}"><h3>Nevada ballot lead${gap==null?'':`<span style="color:${col(gap)}">${n(gap)}</span>`}</h3>
    <div class="m">D&minus;R ballots cast, by day of early voting<br>2026 <b style="color:${col(now[1])}">${n(now[1])}</b>${then?` vs 2024 <b style="color:${col(then[1])}">${n(then[1])}</b> at Day ${now[0]}`:''}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg></div>`;
}
function renderTrend(){
  const ord={same:0,final:1,county:2},M={all:'All early votes',mail:'Mail ballots',county:'County lean'};
  const B=DATA.battlegrounds.filter(b=>b.trend&&b.trend.series['2026']).sort((a,b)=>(ord[a.headline.kind]-ord[b.headline.kind])||b.headline.value-a.headline.value);
  const thru=DATA.battlegrounds.map(b=>b.data_through).sort().pop();
  const d=new Date(thru+'T12:00:00'),left=Math.round((new Date('2026-11-03T12:00:00')-d)/864e5);
  const date=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  // big number: the change since 2024; the line under it gives the 2026 and 2024 levels behind it
  const pn=b=>{const t=b.trend,h=b.headline,base=h.kind==='same'||h.same_day?'2024':'2024 final';
    return `<div class="pn${h.kind==='same'?'':' sec'}"><h3>${esc(b.state_name)}<span style="color:${col(h.value)}">${sgn(h.value)}</span></h3>
      <div class="m">${h.votes==='primary'?'Primary-ballot party':M[t.measure]}<br>2026 <b style="color:${col(h.to)}">${sgn(h.to)}</b> vs ${base} <b style="color:${col(h.from)}">${sgn(h.from)}</b></div>${chart(t,b.days_out)}</div>`};
  const missing=DATA.battlegrounds.filter(b=>!B.includes(b)).map(b=>b.state_name);
  // Nevada's raw ballot lead fills the empty end of the last row, when two or more tiles are free
  const free=(4-B.length%4)%4,nv=free>=2?nvTile(DATA.nv_firewall,free):'';
  document.getElementById('stage').innerHTML=`
    <div class="kicker">2026 early vote · battlegrounds</div>
    <h1>The early vote, day by day</h1>
    <div class="sub">Big number: change in the D&minus;R margin since 2024. Through ${date}, ${left} days to go.</div>
    <div class="key"><span><i style="background:${TC[2026]}"></i>2026</span><span><i style="background:${TC[2024]}"></i>2024</span><span><i style="background:${TC[2022]}"></i>2022</span>
      <span>Dashed line = that year's final</span></div>
    <div class="grid">${B.map(pn).join('')}${nv}</div>
    <div class="foot"><b>All early votes</b>: every day of all three cycles. <b>Mail ballots</b>: 2024 dots are the few days on file. <b>County lean</b>: the 2024 presidential margin of the counties early votes come from, where party data isn't usable; daily for every cycle in Texas and Ohio, elsewhere against the whole 2024 and 2022 early vote (dashed).${missing.length?` ${esc(missing.join(', '))}: no daily data.`:''}${nv?' <b>Nevada ballot lead</b>: 2024 and early 2026 days from @umichvoter\'s chart of the NV Secretary of State\'s daily reports.':''}
      Sources: UF Election Lab, state election offices, EAC.
      <div class="url">homedoctorpro.github.io/election-tracker</div></div>`;
}
function fit(){const w=document.getElementById('wrap'),s=Math.min(1,w.clientWidth/1080);
  document.getElementById('stage').style.transform=`scale(${s})`;w.style.height=1350*s+'px'}
// both: 2022, 2024 and 2026 on one axis per state, with the shift against each year
function renderBoth(){
  const H=b=>b.headlines||{},B=DATA.battlegrounds.filter(b=>H(b)['2024']||H(b)['2022']);
  // 2022 shares the axis only when it measures the same thing as 2024 (same 2026 value)
  const same22=b=>{const a=H(b)['2024'],c=H(b)['2022'];return a&&c&&a.kind===c.kind&&a.to===c.to};
  const vals=B.flatMap(b=>[H(b)['2024']?.from,H(b)['2024']?.to,same22(b)?H(b)['2022'].from:null]).filter(v=>v!=null).map(Math.abs);
  const lim=Math.max(20,Math.ceil(Math.max(...vals)/10)*10),pos=v=>50+50*Math.max(-lim,Math.min(lim,v))/lim;
  const thru=DATA.battlegrounds.map(b=>b.data_through).sort().pop();
  const d=new Date(thru+'T12:00:00'),left=Math.round((new Date('2026-11-03T12:00:00')-d)/864e5);
  const date=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const C22='#9aa0a8',C24='#e08a1e';
  const num=(h,star)=>h?`<span style="color:${col(h.value)}">${sgn(h.value)}${star?'<sup>*</sup>':''}</span>`:'<span style="color:#b9b5ac">&ndash;</span>';
  const row=b=>{const a=H(b)['2024'],c=H(b)['2022'],m=a||c,to=m.to,solid=m.kind==='same'||m.same_day;
    const seg=(from,color)=>`<div class="ln${solid?'':' dash'}" style="left:${Math.min(pos(from),pos(to))}%;width:${Math.abs(pos(to)-pos(from))}%;background:${color};color:${color};height:3px;top:13.5px;opacity:.8"></div>`;
    const dot=(v,color)=>`<div class="o" style="left:${pos(v)}%;border-color:${color}"></div>`;
    const show22=c&&(!a||same22(b));
    return `<div class="row b3${early(b)?' early':''}">
      <div class="st"><b>${label(b)}</b><small>${votes({...b,headline:m})}</small></div>
      <div class="tr"><div class="bg"></div><div class="mid"></div>
        ${show22?seg(c.from,C22):''}${a?seg(a.from,C24):''}${show22?dot(c.from,C22):''}${a?dot(a.from,C24):''}
        <div class="s" style="left:${pos(to)}%;background:${col(to)}"></div></div>
      <div class="sh2">${num(a)}</div><div class="sh2">${num(c,c&&a&&!same22(b))}</div></div>`};
  const kindOf=b=>(H(b)['2024']||H(b)['2022']).kind;
  const by=(x,y)=>(early(x)-early(y))||((H(y)['2024']||H(y)['2022']).value-(H(x)['2024']||H(x)['2022']).value);
  const G=[['same','Same day','all early votes vs this point in each year'],['final','Vs final','mail and in-person votes vs the final 2024 mix'],
    ['county','County lean','where early votes come from (2024 margin of each county)']];
  const missing=DATA.battlegrounds.filter(b=>!B.includes(b)).map(b=>b.state_name);
  const starred=B.filter(b=>H(b)['2022']&&H(b)['2024']&&!same22(b)).map(b=>b.state);
  document.getElementById('stage').innerHTML=`
    <div class="kicker">2026 early vote · battlegrounds</div>
    <h1>The early vote vs 2022 and 2024</h1>
    <div class="sub">D&minus;R margin of early votes. Through ${date}, ${left} days to Election Day.</div>
    <div class="key"><span><i style="border:4px solid ${C22};background:#fff"></i>2022</span><span><i style="border:4px solid ${C24};background:#fff"></i>2024</span><span><i style="background:var(--dem)"></i>2026</span>
      <span class="ax"><b>&larr; R</b> &nbsp;&nbsp; <em>D &rarr;</em></span></div>
    <div class="row b3 hd"><span></span><span></span><span class="sh2">vs 2024</span><span class="sh2">vs 2022</span></div>
    ${G.map(([g,t,s])=>{const L=split(B.filter(b=>kindOf(b)===g).sort(by));return L.length?`<div class="grp"><b>${t}</b><span>${s}</span></div>${L.map(row).join('')}`:''}).join('')}
    <div class="foot"><b>Same day</b> is the most reliable read (Ohio: last primary ballot taken, not registration). <b>Vs final</b> rows are rough: early mail leans more Democratic than the final count, and in-person voting gets more Republican as it goes. <b>County lean</b> uses the same day where the state reports daily (Texas, Ohio vs 2024), otherwise that year's final early vote by county.${starred.length?` <b>*</b> No 2022 party data in ${esc(starred.join(', '))}, so their 2022 shift is county lean and isn't drawn.`:''}${missing.length?` ${esc(missing.join(', '))}: no data.`:''}
      Sources: UF Election Lab, state election offices, EAC.
      <div class="url">homedoctorpro.github.io/election-tracker</div></div>`;
}
(MODE==='trend'?renderTrend:MODE==='both'?renderBoth:render)();fit();addEventListener('resize',fit);
</script>
