name: Daily refresh

on:
  schedule:
    - cron: "15 11 * * *"   # 7:15 AM EDT / 6:15 AM EST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5

      - name: Pull sources and build site
        id: run
        run: |
          set +e
          python -m tracker.run --site --archive
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Commit daily history and archive
        run: |
          git config user.name "election-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history data/archive
          git diff --cached --quiet || git commit -m "Daily snapshot $(TZ=America/New_York date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Fail if any source failed
        if: steps.run.outputs.rc != '0'
        run: exit 1
